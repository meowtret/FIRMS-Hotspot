name: Hotspot Overlay & Alert

# Dipicu oleh n8n via repository_dispatch
# atau bisa dijalankan manual dari tab Actions
on:
  workflow_dispatch:
  repository_dispatch:
    types: [hotspot-update]

jobs:
  overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout repo (termasuk hotspot.csv yang baru di-push n8n)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Setup Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install dependensi spasial
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install geopandas shapely pandas requests

      # 4. Jalankan script overlay
      - name: Run spatial overlay
        run: python scripts/overlay.py

      # 5. Commit result.json kembali ke repo (opsional, untuk histori)
      - name: Commit result to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/result.json
          git diff --cached --quiet || git commit -m "chore: update result $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. Kirim result.json ke n8n Webhook
      - name: Send result to n8n webhook
        run: |
          curl -s -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d @results/result.json
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
