name: Overlay Hotspot

on:
  push:
    paths:
      - "data/hotspot.csv"
      - "scripts/overlay.py"
      - ".github/workflows/overlay.yml"
      - "requirements.txt"
  workflow_dispatch:
  repository_dispatch:
    types:
      - firms_hotspot_uploaded

permissions:
  contents: write

jobs:
  overlay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run hotspot overlay
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
          SUPABASE_GEOM_COLUMN: ${{ secrets.SUPABASE_GEOM_COLUMN }}
          SUPABASE_SELECT: ${{ secrets.SUPABASE_SELECT }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          HOTSPOT_CSV: data/hotspot.csv
          WILAYAH_GEOJSON: data/wilayah.geojson
          RESULT_JSON: results/result.json
          RESULT_CSV: results/result.csv
          SEND_EMPTY_RESULT: "true"
        run: python scripts/overlay.py

      - name: Commit result files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/result.json results/result.csv data/wilayah.geojson
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Update hotspot overlay result"
            git push
          fi
